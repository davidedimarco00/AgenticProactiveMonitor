[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "$HOST_ID"
  omit_hostname = false
  skip_processors_after_aggregators = false

[global_tags]
  project = "AgenticProactiveMonitor"
  environment = "thesis-lab"
  monitored_by = "telegraf"
  host_id = "$HOST_ID"
  machine_role = "$MACHINE_ROLE"

# Telegraf's native OpenSearch output stores fields below an object named after
# the measurement. For example, this input produces cpu.usage_active.
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true
  [inputs.cpu.tags]
    metric_type = "cpu"

# This input produces mem.used_percent and the remaining native memory fields.
[[inputs.mem]]
  [inputs.mem.tags]
    metric_type = "memory"

[[inputs.disk]]
  [inputs.disk.tags]
    metric_type = "disk"

[[inputs.diskio]]
  [inputs.diskio.tags]
    metric_type = "diskio"

[[inputs.net]]
  [inputs.net.tags]
    metric_type = "network"

[[inputs.system]]
  [inputs.system.tags]
    metric_type = "system"

[[inputs.swap]]
  [inputs.swap.tags]
    metric_type = "swap"

[[inputs.processes]]
  [inputs.processes.tags]
    metric_type = "processes"

[[inputs.kernel]]
  [inputs.kernel.tags]
    metric_type = "kernel"

[[outputs.opensearch]]
  urls = ["http://opensearch:9200"]
  index_name = "metrics-{{.Time.Format \"2006.01.02\"}}"
  timeout = "10s"
  enable_sniffer = false
  health_check_interval = "10s"
  manage_template = false
  template_name = "telegraf"
  startup_error_behavior = "retry"
