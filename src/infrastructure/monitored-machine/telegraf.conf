[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "$HOST_ID"
  omit_hostname = false
  skip_processors_after_aggregators = false

[global_tags]
  project = "AgenticProactiveMonitor"
  environment = "thesis-lab"
  monitored_by = "telegraf"
  host_id = "$HOST_ID"
  machine_role = "$MACHINE_ROLE"

# Collect the complete CPU measurement. report_active adds usage_active, which
# is the field used by the CPU anomaly detector. Per-core samples are disabled
# so every host contributes one stable system-level sample per interval.
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true
  [inputs.cpu.tags]
    metric_type = "cpu"

# Collect the complete memory measurement. The detector uses used_percent, but
# the remaining fields are retained in OpenSearch for investigation and charts.
[[inputs.mem]]
  [inputs.mem.tags]
    metric_type = "memory"

[[inputs.disk]]

[[inputs.diskio]]

[[inputs.net]]

[[inputs.system]]

[[inputs.swap]]

[[inputs.processes]]

[[inputs.kernel]]

[[outputs.opensearch]]
  urls = ["http://opensearch:9200"]
  index_name = "metrics-{{.Time.Format \"2006.01.02\"}}"
  timeout = "10s"
  enable_sniffer = false
  health_check_interval = "10s"
  manage_template = false
  template_name = "telegraf"
  startup_error_behavior = "retry"
