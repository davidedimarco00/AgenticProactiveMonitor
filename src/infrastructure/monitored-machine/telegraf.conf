[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "$HOST_ID"
  omit_hostname = false
  skip_processors_after_aggregators = false

[global_tags]
  project = "AgenticProactiveMonitor"
  environment = "thesis-lab"
  monitored_by = "telegraf"
  host_id = "$HOST_ID"
  machine_role = "$MACHINE_ROLE"

# One system-level CPU sample per interval. Per-core samples are intentionally
# disabled because they would distort the average used by the anomaly detector.
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true
  fieldinclude = ["usage_active", "usage_idle", "usage_user", "usage_system"]
  [inputs.cpu.tags]
    metric_type = "cpu"

# Memory usage is identified explicitly so its used_percent field is not mixed
# with disk.used_percent documents in OpenSearch.
[[inputs.mem]]
  fieldinclude = ["total", "available", "used", "used_percent", "available_percent"]
  [inputs.mem.tags]
    metric_type = "memory"

[[inputs.disk]]

[[inputs.diskio]]

[[inputs.net]]

[[inputs.system]]

[[inputs.swap]]

[[inputs.processes]]

[[inputs.kernel]]

[[outputs.opensearch]]
  urls = ["http://opensearch:9200"]
  index_name = "metrics-{{.Time.Format \"2006.01.02\"}}"
  timeout = "10s"
  enable_sniffer = false
  health_check_interval = "10s"
  manage_template = false
  template_name = "telegraf"
