name: agentic-proactive-monitor-infrastructure

x-monitored-machine: &monitored-machine
  build:
    context: ./monitored-machine
  depends_on:
    opensearch-init:
      condition: service_completed_successfully
  networks:
    - monitoring-net
  restart: unless-stopped

services:
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-3.7.0}
    container_name: agentic-opensearch
    environment:
      cluster.name: agentic-monitor-cluster
      node.name: agentic-opensearch-node
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${OPENSEARCH_HTTP_PORT:-9200}:9200"
      - "${OPENSEARCH_PERFORMANCE_ANALYZER_PORT:-9600}:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_DASHBOARDS_VERSION:-3.7.0}
    container_name: agentic-opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - monitoring-net
    restart: unless-stopped

  opensearch-init:
    image: curlimages/curl:8.10.1
    container_name: agentic-opensearch-init
    environment:
      OPENSEARCH_URL: http://opensearch:9200
    volumes:
      - ./opensearch/init/create-index-templates.sh:/create-index-templates.sh:ro
    command: ["sh", "/create-index-templates.sh"]
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - monitoring-net
    restart: "no"

  machine-01:
    <<: *monitored-machine
    container_name: machine-01
    hostname: machine-01
    environment:
      HOST_ID: machine-01
      MACHINE_ROLE: application-server
      LOG_LEVEL_PROFILE: normal
      LATENCY_MIN: 10
      LATENCY_MAX: 500
      LOG_INTERVAL: ${LOG_INTERVAL:-3}

  machine-02:
    <<: *monitored-machine
    container_name: machine-02
    hostname: machine-02
    environment:
      HOST_ID: machine-02
      MACHINE_ROLE: database-server
      LOG_LEVEL_PROFILE: normal
      LATENCY_MIN: 20
      LATENCY_MAX: 700
      LOG_INTERVAL: ${LOG_INTERVAL:-3}

  machine-03:
    <<: *monitored-machine
    container_name: machine-03
    hostname: machine-03
    environment:
      HOST_ID: machine-03
      MACHINE_ROLE: api-gateway
      LOG_LEVEL_PROFILE: unstable
      LATENCY_MIN: 30
      LATENCY_MAX: 900
      LOG_INTERVAL: ${LOG_INTERVAL:-3}

  machine-04:
    <<: *monitored-machine
    container_name: machine-04
    hostname: machine-04
    environment:
      HOST_ID: machine-04
      MACHINE_ROLE: worker-node
      LOG_LEVEL_PROFILE: normal
      LATENCY_MIN: 40
      LATENCY_MAX: 1100
      LOG_INTERVAL: ${LOG_INTERVAL:-3}

  machine-05:
    <<: *monitored-machine
    container_name: machine-05
    hostname: machine-05
    environment:
      HOST_ID: machine-05
      MACHINE_ROLE: edge-node
      LOG_LEVEL_PROFILE: critical
      LATENCY_MIN: 50
      LATENCY_MAX: 1300
      LOG_INTERVAL: ${LOG_INTERVAL:-3}

  opensearch-detectors-init:
    image: curlimages/curl:8.10.1
    container_name: agentic-opensearch-detectors-init
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      DETECTOR_WAIT_SECONDS: ${DETECTOR_WAIT_SECONDS:-300}
      DETECTOR_MIN_DOCUMENTS: ${DETECTOR_MIN_DOCUMENTS:-20}
    volumes:
      - ./opensearch/init/create-anomaly-detectors.sh:/create-anomaly-detectors.sh:ro
    command: ["sh", "/create-anomaly-detectors.sh"]
    depends_on:
      machine-01:
        condition: service_healthy
      machine-02:
        condition: service_healthy
      machine-03:
        condition: service_healthy
      machine-04:
        condition: service_healthy
      machine-05:
        condition: service_healthy
    networks:
      - monitoring-net
    restart: "no"

networks:
  monitoring-net:
    driver: bridge

volumes:
  opensearch-data:
