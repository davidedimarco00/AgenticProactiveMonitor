name: agentic-proactive-monitor-infrastructure

services:
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-3.6.0}
    container_name: agentic-opensearch
    environment:
      cluster.name: agentic-monitor-cluster
      node.name: agentic-opensearch-node
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:${OPENSEARCH_HTTP_PORT:-9200}:9200"
      - "127.0.0.1:${OPENSEARCH_PERFORMANCE_ANALYZER_PORT:-9600}:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - monitoring-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_DASHBOARDS_VERSION:-3.6.0}
    container_name: agentic-opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "127.0.0.1:${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
        restart: true
    networks:
      - monitoring-net
    restart: unless-stopped

  opensearch-init:
    image: curlimages/curl:${CURL_IMAGE_VERSION:-8.10.1}
    container_name: agentic-opensearch-init
    environment:
      OPENSEARCH_URL: http://opensearch:9200
    volumes:
      - ./opensearch/init/create-index-templates.sh:/create-index-templates.sh:ro
    command: ["sh", "/create-index-templates.sh"]
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - monitoring-net
    restart: "no"

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.18.1}
    container_name: agentic-qdrant
    environment:
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - monitoring-net
    restart: unless-stopped

  qdrant-init:
    image: curlimages/curl:${CURL_IMAGE_VERSION:-8.10.1}
    container_name: agentic-qdrant-init
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTIONS: ${QDRANT_COLLECTIONS:-monitored-system}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-384}
      QDRANT_DISTANCE: ${QDRANT_DISTANCE:-Cosine}
      QDRANT_WAIT_SECONDS: ${QDRANT_WAIT_SECONDS:-120}
    volumes:
      - ./knowledge_base/qdrant/init/create-collection.sh:/create-collection.sh:ro
    command: ["sh", "/create-collection.sh"]
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - monitoring-net
    restart: "no"

  knowledge-base-ingest:
    build:
      context: ./knowledge_base/ingest
    container_name: agentic-knowledge-base-ingest
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: ${OLLAMA_HOST_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-ibm/granite-embedding:30m}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-384}
      KNOWLEDGE_COLLECTIONS_CONFIG: /config/collections.yaml
      KNOWLEDGE_REPO_ROOT: /repo
      KNOWLEDGE_BASE_CHUNK_SIZE_WORDS: ${KNOWLEDGE_BASE_CHUNK_SIZE_WORDS:-220}
      KNOWLEDGE_BASE_CHUNK_OVERLAP_WORDS: ${KNOWLEDGE_BASE_CHUNK_OVERLAP_WORDS:-40}
      KNOWLEDGE_INGEST_EMBED_BATCH_SIZE: ${KNOWLEDGE_INGEST_EMBED_BATCH_SIZE:-16}
      KNOWLEDGE_INGEST_UPSERT_BATCH_SIZE: ${KNOWLEDGE_INGEST_UPSERT_BATCH_SIZE:-64}
      KNOWLEDGE_INGEST_WAIT_SECONDS: ${KNOWLEDGE_INGEST_WAIT_SECONDS:-120}
    volumes:
      - ./knowledge_base/collections.yaml:/config/collections.yaml:ro
      - ../monitored_system/knowledge_base:/repo/src/monitored_system/knowledge_base:ro
    depends_on:
      qdrant-init:
        condition: service_completed_successfully
    networks:
      - monitoring-net
    restart: "no"

  knowledge-base-web:
    build:
      context: ./knowledge_base/web
    container_name: agentic-knowledge-base-web
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_MONITORED_SYSTEM_COLLECTION:-monitored-system}
      OLLAMA_URL: ${OLLAMA_HOST_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-ibm/granite-embedding:30m}
      MAX_UPLOAD_MB: ${KNOWLEDGE_BASE_MAX_UPLOAD_MB:-25}
      CHUNK_SIZE_WORDS: ${KNOWLEDGE_BASE_CHUNK_SIZE_WORDS:-220}
      CHUNK_OVERLAP_WORDS: ${KNOWLEDGE_BASE_CHUNK_OVERLAP_WORDS:-40}
      SEARCH_LIMIT: ${KNOWLEDGE_BASE_SEARCH_LIMIT:-5}
      FLASK_SECRET_KEY: ${KNOWLEDGE_BASE_FLASK_SECRET_KEY:-change-this-flask-secret}
    ports:
      - "127.0.0.1:${KNOWLEDGE_BASE_UI_PORT:-5000}:5000"
    depends_on:
      knowledge-base-ingest:
        condition: service_completed_successfully
    networks:
      - monitoring-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:5000/health'', timeout=5)" || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION:-v0.9.5}
    container_name: agentic-open-webui
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_HOST_URL:-http://host.docker.internal:11434}
      RAG_EMBEDDING_ENGINE: ollama
      RAG_OLLAMA_BASE_URL: ${OLLAMA_HOST_URL:-http://host.docker.internal:11434}
      RAG_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-ibm/granite-embedding:30m}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      VECTOR_DB: qdrant
      QDRANT_URI: http://qdrant:6333
      QDRANT_TIMEOUT: 10
      WEBUI_AUTH: ${OPEN_WEBUI_AUTH:-true}
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:-change-this-secret-before-first-start}
      ENABLE_SIGNUP: ${OPEN_WEBUI_ENABLE_SIGNUP:-true}
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - monitoring-net
    restart: unless-stopped

  xmpp:
    image: prosodyim/prosody:${PROSODY_VERSION:-13.0}
    container_name: agentic-xmpp
    hostname: xmpp
    environment:
      XMPP_DOMAIN: ${XMPP_DOMAIN:-xmpp}
      XMPP_ALLOW_REGISTRATION: ${XMPP_ALLOW_REGISTRATION:-true}
    ports:
      - "127.0.0.1:${XMPP_CLIENT_PORT:-5222}:5222"
    volumes:
      - ./xmpp/prosody.cfg.lua:/etc/prosody/prosody.cfg.lua:ro
      - xmpp-data:/var/lib/prosody
    networks:
      monitoring-net:
        aliases:
          - ${XMPP_DOMAIN:-xmpp}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "prosodyctl shell server uptime >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  mcp-server:
    build:
      context: ../mcp_server
      dockerfile: Dockerfile
    container_name: agentic-mcp-server
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_PATH: /mcp
      OPENSEARCH_URL: http://opensearch:9200
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_MONITORED_SYSTEM_COLLECTION:-monitored-system}
      QDRANT_MONITORED_SYSTEM_COLLECTION: ${QDRANT_MONITORED_SYSTEM_COLLECTION:-monitored-system}
      OLLAMA_URL: ${OLLAMA_HOST_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-ibm/granite-embedding:30m}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      opensearch:
        condition: service_healthy
      knowledge-base-ingest:
        condition: service_completed_successfully
    networks:
      - monitoring-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  agentic-backend:
    build:
      context: ../agentic_system
      dockerfile: Dockerfile
    container_name: agentic-system-backend
    environment:
      AGENT_CONFIG_PATH: /app/config/agents.yaml
      AGENT_HEALTH_HOST: 0.0.0.0
      AGENT_HEALTH_PORT: 8081
      AGENT_LLM_CONTEXT: ${AGENT_LLM_CONTEXT:-8192}
      AGENT_MAX_LLM_CONCURRENCY: ${AGENT_MAX_LLM_CONCURRENCY:-2}
      XMPP_DOMAIN: ${XMPP_DOMAIN:-xmpp}
      XMPP_HOST: xmpp
      XMPP_PORT: 5222
      XMPP_AUTO_REGISTER: ${XMPP_AUTO_REGISTER:-true}
      XMPP_TECHNICAL_LEAD_PASSWORD: ${XMPP_TECHNICAL_LEAD_PASSWORD:-change-this-local-password}
      XMPP_SYSTEM_ENGINEER_PASSWORD: ${XMPP_SYSTEM_ENGINEER_PASSWORD:-change-this-local-password}
      XMPP_NETWORK_ENGINEER_PASSWORD: ${XMPP_NETWORK_ENGINEER_PASSWORD:-change-this-local-password}
      XMPP_APPLICATION_ENGINEER_PASSWORD: ${XMPP_APPLICATION_ENGINEER_PASSWORD:-change-this-local-password}
      XMPP_SOFTWARE_DEVELOPER_PASSWORD: ${XMPP_SOFTWARE_DEVELOPER_PASSWORD:-change-this-local-password}
      MCP_URL: http://mcp-server:8000/mcp
      OLLAMA_URL: ${OLLAMA_HOST_URL:-http://host.docker.internal:11434}
      OLLAMA_REASONING_MODEL: ${OLLAMA_CHAT_MODEL:-gemma4:e2b}
      OLLAMA_TOOL_MODEL: ${OLLAMA_TOOL_MODEL:-qwen3.5:4b}
      OLLAMA_FALLBACK_TOOL_MODEL: ${OLLAMA_FALLBACK_TOOL_MODEL:-qwen2.5:latest}
    ports:
      - "127.0.0.1:${AGENTIC_BACKEND_HEALTH_PORT:-8081}:8081"
    depends_on:
      xmpp:
        condition: service_healthy
      mcp-server:
        condition: service_started
    networks:
      - monitoring-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8081/health'', timeout=5)" || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    stop_grace_period: 15s
    restart: unless-stopped

  agentic-system-dashboard:
    build:
      context: ../agentic_dashboard
      dockerfile: Dockerfile
    container_name: agentic-system-dashboard
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: ${OLLAMA_HOST_URL:-http://host.docker.internal:11434}
      MCP_HOST: mcp-server
      MCP_PORT: 8000
      XMPP_HOST: xmpp
      XMPP_PORT: 5222
      INCIDENT_INDEX_PREFIX: ${INCIDENT_INDEX_PREFIX:-agentic-incidents}
      AGENT_EVENT_INDEX_PREFIX: ${AGENT_EVENT_INDEX_PREFIX:-agentic-agent-events}
      DASHBOARD_REQUEST_TIMEOUT_SECONDS: ${DASHBOARD_REQUEST_TIMEOUT_SECONDS:-2.5}
    ports:
      - "127.0.0.1:${AGENTIC_DASHBOARD_PORT:-5050}:5050"
    depends_on:
      opensearch:
        condition: service_healthy
      qdrant:
        condition: service_started
      mcp-server:
        condition: service_started
      xmpp:
        condition: service_healthy
    networks:
      - monitoring-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:5050/health'', timeout=5)" || exit 1',
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  opensearch-dashboards-init:
    image: curlimages/curl:${CURL_IMAGE_VERSION:-8.10.1}
    container_name: agentic-opensearch-dashboards-init
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      DASHBOARDS_URL: http://opensearch-dashboards:5601
      DASHBOARDS_WAIT_SECONDS: ${DASHBOARDS_WAIT_SECONDS:-3600}
      DASHBOARDS_INDEX_PATTERN_HOSTS: ${MONITORED_HOSTS:-traffic-generator api-gateway processing-service data-service worker-service}
    volumes:
      - ./opensearch-dashboards/init/create-index-patterns.sh:/create-index-patterns.sh:ro
    command: ["sh", "/create-index-patterns.sh"]
    depends_on:
      opensearch-dashboards:
        condition: service_started
    networks:
      - monitoring-net
    restart: "no"

  opensearch-detectors-init:
    image: curlimages/curl:${CURL_IMAGE_VERSION:-8.10.1}
    container_name: agentic-opensearch-detectors-init
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      DETECTOR_WAIT_SECONDS: ${DETECTOR_WAIT_SECONDS:-3600}
      DETECTOR_REQUIRED_INTERVALS: ${DETECTOR_REQUIRED_INTERVALS:-40}
      DETECTOR_HOSTS: ${MONITORED_HOSTS:-traffic-generator api-gateway processing-service data-service worker-service}
    volumes:
      - ./opensearch/init/create-anomaly-detectors.sh:/create-anomaly-detectors.sh:ro
    command: ["sh", "/create-anomaly-detectors.sh"]
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - monitoring-net
    restart: "no"

networks:
  monitoring-net:
    name: ${OBSERVABILITY_NETWORK_NAME:-agentic-monitoring-net}
    driver: bridge

volumes:
  opensearch-data:
  qdrant-data:
  open-webui-data:
  xmpp-data:
