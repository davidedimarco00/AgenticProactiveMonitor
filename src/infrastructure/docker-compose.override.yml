services:
  opensearch:
    environment:
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  opensearch-dashboards:
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true

  # Install mappings before any monitored machine is allowed to send telemetry.
  opensearch-init:
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_USERNAME=
      - OPENSEARCH_PASSWORD=
    command: ["sh", "/create-index-templates.sh"]

  machine-01:
    depends_on:
      opensearch-init:
        condition: service_completed_successfully

  machine-02:
    depends_on:
      opensearch-init:
        condition: service_completed_successfully

  machine-03:
    depends_on:
      opensearch-init:
        condition: service_completed_successfully

  machine-04:
    depends_on:
      opensearch-init:
        condition: service_completed_successfully

  machine-05:
    depends_on:
      opensearch-init:
        condition: service_completed_successfully

  # Validate real Telegraf and Fluent Bit documents before creating any
  # consumer. The job fails explicitly if mappings, nested paths, timestamps,
  # tags, or five-host coverage do not match the observability contract.
  opensearch-telemetry-init:
    image: python:3.12-alpine
    container_name: agentic-opensearch-telemetry-init
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - TELEMETRY_SCHEMA_WAIT_SECONDS=180
      - TELEMETRY_SCHEMA_LOOKBACK=now-10m
      - TELEMETRY_EXPECTED_HOSTS=machine-01,machine-02,machine-03,machine-04,machine-05
    volumes:
      - ./opensearch/init/validate-telemetry-schema.py:/validate-telemetry-schema.py:ro
      - ./opensearch/init/validate-log-schema.py:/validate-log-schema.py:ro
    command:
      [
        "sh",
        "-c",
        "python /validate-telemetry-schema.py && python /validate-log-schema.py",
      ]
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
      machine-01:
        condition: service_started
      machine-02:
        condition: service_started
      machine-03:
        condition: service_started
      machine-04:
        condition: service_started
      machine-05:
        condition: service_started
    networks:
      - monitoring-net
    restart: "no"

  # Create CPU and memory detectors only after the complete telemetry contract
  # has been validated against real documents from all five machines.
  opensearch-detectors-init:
    image: curlimages/curl:8.10.1
    container_name: agentic-opensearch-detectors-init
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_USERNAME=
      - OPENSEARCH_PASSWORD=
      - DETECTOR_WAIT_SECONDS=180
      - DETECTOR_MIN_DOCUMENTS=5
    volumes:
      - ./opensearch/init/create-anomaly-detectors.sh:/create-anomaly-detectors.sh:ro
    command: ["sh", "/create-anomaly-detectors.sh"]
    depends_on:
      opensearch-telemetry-init:
        condition: service_completed_successfully
    networks:
      - monitoring-net
    restart: "no"

  # Build complete data-view field metadata from _field_caps after real metrics
  # and logs exist, instead of leaving Discover with an empty/stale field cache.
  opensearch-dashboards-init:
    image: python:3.12-alpine
    container_name: agentic-opensearch-dashboards-init
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - DASHBOARDS_URL=http://opensearch-dashboards:5601
      - DASHBOARDS_WAIT_SECONDS=180
    volumes:
      - ./opensearch-dashboards/init/create-index-patterns.py:/create-index-patterns.py:ro
    command: ["python", "/create-index-patterns.py"]
    depends_on:
      opensearch-telemetry-init:
        condition: service_completed_successfully
      opensearch-dashboards:
        condition: service_started
    networks:
      - monitoring-net
    restart: "no"

  xmpp-init:
    image: docker:27-cli
    container_name: agentic-xmpp-init
    environment:
      - XMPP_CONTAINER_NAME=agentic-xmpp
      - XMPP_DOMAIN=xmpp
      - XMPP_COORDINATOR_PASSWORD=${XMPP_COORDINATOR_PASSWORD:-coordinator}
      - XMPP_EVIDENCE_PASSWORD=${XMPP_EVIDENCE_PASSWORD:-evidence}
      - XMPP_REASONING_PASSWORD=${XMPP_REASONING_PASSWORD:-reasoning}
      - XMPP_CRITIC_PASSWORD=${XMPP_CRITIC_PASSWORD:-critic}
      - XMPP_REMEDIATION_PASSWORD=${XMPP_REMEDIATION_PASSWORD:-remediation}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./prosody/provision-accounts.sh:/provision-accounts.sh:ro
    command: ["sh", "/provision-accounts.sh"]
    depends_on:
      xmpp:
        condition: service_healthy
    restart: "no"

  agentic-system:
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_USERNAME=
      - OPENSEARCH_PASSWORD=
      - XMPP_COORDINATOR_PASSWORD=${XMPP_COORDINATOR_PASSWORD:-coordinator}
      - XMPP_EVIDENCE_PASSWORD=${XMPP_EVIDENCE_PASSWORD:-evidence}
      - XMPP_REASONING_PASSWORD=${XMPP_REASONING_PASSWORD:-reasoning}
      - XMPP_CRITIC_PASSWORD=${XMPP_CRITIC_PASSWORD:-critic}
      - XMPP_REMEDIATION_PASSWORD=${XMPP_REMEDIATION_PASSWORD:-remediation}
    depends_on:
      opensearch-detectors-init:
        condition: service_completed_successfully
      xmpp-init:
        condition: service_completed_successfully
