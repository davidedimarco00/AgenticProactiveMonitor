services:
  opensearch:
    environment:
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  opensearch-dashboards:
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true

  opensearch-init:
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_USERNAME=
      - OPENSEARCH_PASSWORD=
      - DETECTOR_WAIT_SECONDS=180
    volumes:
      - ./opensearch/init/create-anomaly-detectors.sh:/create-anomaly-detectors.sh:ro
    command:
      [
        "sh",
        "-c",
        "sh /create-index-templates.sh && sh /create-anomaly-detectors.sh",
      ]

  # Creates the physical bootstrap indexes and the two Dashboards index patterns.
  # It is intentionally independent from detector provisioning, so Discover is
  # available even when the Anomaly Detection initializer is still running.
  opensearch-dashboards-init:
    image: curlimages/curl:8.10.1
    container_name: agentic-opensearch-dashboards-init
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - DASHBOARDS_URL=http://opensearch-dashboards:5601
      - DASHBOARDS_WAIT_SECONDS=180
    volumes:
      - ./opensearch-dashboards/init/create-index-patterns.sh:/create-index-patterns.sh:ro
    command: ["sh", "/create-index-patterns.sh"]
    depends_on:
      opensearch:
        condition: service_healthy
      opensearch-dashboards:
        condition: service_started
    networks:
      - monitoring-net
    restart: "no"

  xmpp-init:
    image: docker:27-cli
    container_name: agentic-xmpp-init
    environment:
      - XMPP_CONTAINER_NAME=agentic-xmpp
      - XMPP_DOMAIN=xmpp
      - XMPP_COORDINATOR_PASSWORD=${XMPP_COORDINATOR_PASSWORD:-coordinator}
      - XMPP_EVIDENCE_PASSWORD=${XMPP_EVIDENCE_PASSWORD:-evidence}
      - XMPP_REASONING_PASSWORD=${XMPP_REASONING_PASSWORD:-reasoning}
      - XMPP_CRITIC_PASSWORD=${XMPP_CRITIC_PASSWORD:-critic}
      - XMPP_REMEDIATION_PASSWORD=${XMPP_REMEDIATION_PASSWORD:-remediation}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./prosody/provision-accounts.sh:/provision-accounts.sh:ro
    command: ["sh", "/provision-accounts.sh"]
    depends_on:
      xmpp:
        condition: service_healthy
    restart: "no"

  agentic-system:
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_USERNAME=
      - OPENSEARCH_PASSWORD=
      - XMPP_COORDINATOR_PASSWORD=${XMPP_COORDINATOR_PASSWORD:-coordinator}
      - XMPP_EVIDENCE_PASSWORD=${XMPP_EVIDENCE_PASSWORD:-evidence}
      - XMPP_REASONING_PASSWORD=${XMPP_REASONING_PASSWORD:-reasoning}
      - XMPP_CRITIC_PASSWORD=${XMPP_CRITIC_PASSWORD:-critic}
      - XMPP_REMEDIATION_PASSWORD=${XMPP_REMEDIATION_PASSWORD:-remediation}
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
      xmpp-init:
        condition: service_completed_successfully
