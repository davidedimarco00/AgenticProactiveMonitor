[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  precision = ""
  hostname = "$HOST_ID"
  omit_hostname = false
  skip_processors_after_aggregators = false

[global_tags]
  project = "AgenticProactiveMonitor"
  environment = "thesis-lab"
  monitored_by = "telegraf"
  host_id = "$HOST_ID"
  machine_role = "$MACHINE_ROLE"

# System-level metrics are retained as general diagnostic context.
# CPU/RAM anomaly detectors do NOT use these two measurements anymore because
# Linux containers on the same Docker host share the same kernel view.
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true
  [inputs.cpu.tags]
    metric_type = "system_cpu"

[[inputs.mem]]
  [inputs.mem.tags]
    metric_type = "system_memory"

# Per-container metrics used by the CPU/RAM anomaly detectors.
# Each Telegraf instance queries Docker Engine but includes only the container
# whose name matches its own HOST_ID, preserving single-entity semantics.
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_name_include = ["$HOST_ID"]
  container_state_include = ["running"]
  timeout = "5s"
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]
  [inputs.docker.tags]
    metric_type = "container"

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "squashfs"]
  [inputs.disk.tags]
    metric_type = "disk"

[[inputs.diskio]]
  [inputs.diskio.tags]
    metric_type = "diskio"

[[inputs.net]]
  [inputs.net.tags]
    metric_type = "network"

[[inputs.system]]
  [inputs.system.tags]
    metric_type = "system"

[[inputs.swap]]
  [inputs.swap.tags]
    metric_type = "swap"

[[inputs.processes]]
  [inputs.processes.tags]
    metric_type = "processes"

[[inputs.kernel]]
  [inputs.kernel.tags]
    metric_type = "kernel"

[[outputs.opensearch]]
  urls = ["http://opensearch:9200"]
  index_name = "metrics-{{.Tag \"host_id\"}}-{{.Time.Format \"2006.01.02\"}}"
  timeout = "10s"
  enable_sniffer = false
  health_check_interval = "10s"
  manage_template = false
  template_name = "telegraf"
  overwrite_template = false
  force_document_id = true
  float_handling = "drop"
  startup_error_behavior = "retry"
