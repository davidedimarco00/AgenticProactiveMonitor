[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  precision = ""
  hostname = "$HOST_ID"
  omit_hostname = false
  skip_processors_after_aggregators = false

[global_tags]
  project = "AgenticProactiveMonitor"
  environment = "thesis-lab"
  monitored_by = "telegraf"
  host_id = "$HOST_ID"
  machine_role = "$MACHINE_ROLE"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true
  [inputs.cpu.tags]
    metric_type = "system_cpu"

[[inputs.mem]]
  [inputs.mem.tags]
    metric_type = "system_memory"

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_name_include = ["$HOST_ID"]
  container_state_include = ["running"]
  timeout = "5s"
  perdevice_include = []
  total_include = ["cpu", "blkio", "network"]
  docker_label_exclude = ["*"]

  [inputs.docker.tags]
    metric_type = "container"

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "squashfs"]
  [inputs.disk.tags]
    metric_type = "disk"

[[inputs.diskio]]
  [inputs.diskio.tags]
    metric_type = "diskio"

# Passive interface telemetry: bytes, packets, errors and drops.
[[inputs.net]]
  [inputs.net.tags]
    metric_type = "network"

# ICMP RTT is retained as an independent reference for the raw Docker path.
[[inputs.ping]]
  urls = ["$NETWORK_PING_TARGET"]
  method = "native"
  count = 3
  deadline = "3s"
  percentiles = [50, 95, 99]
  ipv4 = true

  [inputs.ping.tags]
    metric_type = "network_latency_reference"
    network_target = "$NETWORK_TARGET_NAME"

# Layer-4 transport latency used by NETLAT detectors. For TCP, send/expect are
# intentionally omitted: response_time therefore represents the connection
# establishment time rather than application processing time.
[[inputs.net_response]]
  name_override = "network_transport_latency"
  protocol = "tcp"
  address = "$NETWORK_TCP_TARGET"
  timeout = "2s"
  fieldexclude = ["result_type", "string_found"]

  [inputs.net_response.tags]
    metric_type = "network_transport_latency"
    network_target = "$NETWORK_TARGET_NAME"

# Layer-7 application/service latency used by APPLAT detectors. The /health
# request traverses the target service's real dependency path, so controlled
# application delays are visible here without being confused with TCP-connect
# latency. Eight seconds is intentionally above the 5 s thesis test fault.
[[inputs.http_response]]
  name_override = "application_service_latency"
  urls = ["http://$NETWORK_TCP_TARGET$APPLICATION_PROBE_PATH"]
  method = "GET"
  response_timeout = "8s"
  follow_redirects = false

  [inputs.http_response.tags]
    metric_type = "application_service_latency"
    application_target = "$NETWORK_TARGET_NAME"

[[inputs.system]]
  [inputs.system.tags]
    metric_type = "system"

[[inputs.swap]]
  [inputs.swap.tags]
    metric_type = "swap"

[[inputs.processes]]
  [inputs.processes.tags]
    metric_type = "processes"

[[inputs.kernel]]
  [inputs.kernel.tags]
    metric_type = "kernel"

[[outputs.opensearch]]
  urls = ["http://opensearch:9200"]
  index_name = "metrics-{{.Tag \"host_id\"}}-{{.Time.Format \"2006.01.02\"}}"
  timeout = "10s"
  enable_sniffer = false
  health_check_interval = "10s"
  manage_template = false
  template_name = "telegraf"
  overwrite_template = false
  force_document_id = true
  float_handling = "drop"
  startup_error_behavior = "retry"
