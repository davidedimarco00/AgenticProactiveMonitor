[SERVICE]
    Flush        5
    Daemon       Off
    Log_Level    info
    Parsers_File /etc/fluent-bit/parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/machine/app.log
    Tag               app.${HOST_ID}
    Parser            app_json
    DB                /var/log/machine/fluent-bit-app.db
    DB.Sync           Normal
    Read_from_Head    On
    Refresh_Interval  2
    Rotate_Wait       30
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

[INPUT]
    Name              tail
    Path              /var/log/machine/system.log
    Tag               system.${HOST_ID}
    Parser            app_json
    DB                /var/log/machine/fluent-bit-system.db
    DB.Sync           Normal
    Read_from_Head    On
    Refresh_Interval  2
    Rotate_Wait       30
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

[INPUT]
    Name              tail
    Path              /var/log/machine/runtime.log
    Tag               runtime.${HOST_ID}
    Key               message
    DB                /var/log/machine/fluent-bit-runtime.db
    DB.Sync           Normal
    Read_from_Head    On
    Refresh_Interval  2
    Rotate_Wait       30
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

[FILTER]
    Name         modify
    Match        *
    Add          project AgenticProactiveMonitor
    Add          environment thesis-lab
    Add          host_id ${HOST_ID}
    Add          machine_role ${MACHINE_ROLE}
    Add          monitored_by fluent-bit

[FILTER]
    Name         modify
    Match        app.*
    Add          log_source application

[FILTER]
    Name         modify
    Match        system.*
    Add          log_source system

[FILTER]
    Name         modify
    Match        runtime.*
    Add          log_source runtime
    Add          service ${HOST_ID}
    Add          event_type runtime_output
    Add          runtime_stream combined

[OUTPUT]
    Name                 opensearch
    Match                *
    Host                 opensearch
    Port                 9200
    TLS                  Off
    Logstash_Format      On
    Logstash_Prefix      logs-${HOST_ID}
    Time_Key             @timestamp
    Suppress_Type_Name   On
    Generate_ID          On
    Replace_Dots         On
    Retry_Limit          False
