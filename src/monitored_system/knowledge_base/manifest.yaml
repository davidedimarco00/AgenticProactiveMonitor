version: 2
domain: monitored_system
system: notes-platform
branch: feature/monitored_system
purpose: diagnostic-rag

agent_roles:
  - coordinator
  - evidence
  - reasoning
  - critic
  - remediation

services:
  - traffic-generator
  - api-gateway
  - processing-service
  - data-service
  - worker-service

excluded_sources:
  - src/monitored_system/infrastructure/tests/**
  - src/monitored_system/infrastructure/scenarios/**
  - src/agentic_system/**

exclusion_reason: >
  Test-suite files, controlled fault-injection ground truth and agent-runtime
  implementation details must not be embedded in the monitored-system knowledge
  base because they can leak evaluation answers or implementation policy into
  diagnosis.

documents:
  - path: shared/system_architecture.md
    agents: [coordinator, evidence, reasoning, critic, remediation]
    document_type: architecture
  - path: shared/observability_model.md
    agents: [evidence, reasoning, critic]
    document_type: observability
  - path: services/service_reference.md
    agents: [coordinator, evidence, reasoning, critic, remediation]
    document_type: service-reference
  - path: diagnostics/cpu_saturation_processing_service.md
    agents: [evidence, reasoning, critic]
    document_type: diagnostic-guide
  - path: diagnostics/memory_pressure_worker_service.md
    agents: [evidence, reasoning, critic]
    document_type: diagnostic-guide
  - path: diagnostics/network_degradation_api_gateway_processing_service.md
    agents: [evidence, reasoning, critic]
    document_type: diagnostic-guide
  - path: diagnostics/application_latency_processing_service.md
    agents: [evidence, reasoning, critic]
    document_type: diagnostic-guide
  - path: diagnostics/data_service_unavailability.md
    agents: [evidence, reasoning, critic]
    document_type: diagnostic-guide
