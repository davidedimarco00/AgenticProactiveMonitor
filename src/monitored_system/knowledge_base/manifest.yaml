version: 6
collection: monitored-system
domain: monitored_system
system: notes-platform
branch: feature/monitored_system
purpose: shared-system-context-rag
access: shared

allowed_roles:
  - technical_lead
  - system_engineer
  - network_engineer
  - application_engineer
  - software_developer

services:
  - traffic-generator
  - api-gateway
  - processing-service
  - data-service
  - worker-service

excluded_sources:
  - src/monitored_system/infrastructure/tests/**
  - src/monitored_system/infrastructure/scenarios/**
  - src/monitored_system/knowledge_base/diagnostics/**
  - src/agentic_system/**

exclusion_reason: >
  Test-suite files, controlled fault-injection ground truth, pre-written
  diagnostic guides and agent-runtime implementation details must not be
  embedded in the monitored-system collection. This collection describes the
  concrete system and the semantics of its observable data. The agents must
  produce diagnoses from live observations.

documents:
  - path: shared/system_architecture.md
    roles: [technical_lead, system_engineer, network_engineer, application_engineer, software_developer]
    document_type: architecture

  - path: shared/dependency_and_impact_model.md
    roles: [technical_lead, system_engineer, network_engineer, application_engineer, software_developer]
    document_type: architecture

  - path: shared/observability_model.md
    roles: [technical_lead, system_engineer, network_engineer, application_engineer, software_developer]
    document_type: observability

  - path: domains/infrastructure_runtime.md
    roles: [system_engineer, technical_lead]
    document_type: domain-reference

  - path: domains/network_connectivity.md
    roles: [network_engineer, technical_lead, application_engineer]
    document_type: domain-reference

  - path: domains/application_operations.md
    roles: [application_engineer, technical_lead, software_developer]
    document_type: domain-reference

  - path: domains/software_behavior.md
    roles: [software_developer, application_engineer]
    document_type: domain-reference

  - path: services/traffic_generator.md
    roles: [technical_lead, system_engineer, network_engineer, application_engineer, software_developer]
    document_type: service-reference

  - path: services/api_gateway.md
    roles: [technical_lead, system_engineer, network_engineer, application_engineer, software_developer]
    document_type: service-reference

  - path: services/processing_service.md
    roles: [technical_lead, system_engineer, network_engineer, application_engineer, software_developer]
    document_type: service-reference

  - path: services/data_service.md
    roles: [technical_lead, system_engineer, network_engineer, application_engineer, software_developer]
    document_type: service-reference

  - path: services/worker_service.md
    roles: [technical_lead, system_engineer, network_engineer, application_engineer]
    document_type: service-reference

retrieval_policy:
  shared_by_all_agents: true
  role_metadata_is_relevance_hint: true
  diagnosis_labels: forbidden
  live_evidence_is_source_of_truth: true
