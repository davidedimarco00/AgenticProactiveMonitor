version: 1
domain: monitored_system
system: notes-platform
branch: feature/monitored_system

agent_roles:
  - coordinator
  - evidence
  - reasoning
  - critic
  - remediation

services:
  - traffic-generator
  - api-gateway
  - processing-service
  - data-service
  - worker-service

documents:
  - path: shared/system_architecture.md
    agents: [coordinator, evidence, reasoning, critic, remediation]
    document_type: architecture
  - path: shared/observability_model.md
    agents: [evidence, reasoning, critic]
    document_type: observability
  - path: agents/coordinator_context.md
    agents: [coordinator]
    document_type: agent-context
  - path: agents/evidence_collection.md
    agents: [evidence]
    document_type: agent-context
  - path: agents/reasoning_diagnosis.md
    agents: [reasoning]
    document_type: agent-context
  - path: agents/critic_validation.md
    agents: [critic]
    document_type: agent-context
  - path: agents/remediation_policy.md
    agents: [remediation]
    document_type: agent-context
  - path: services/service_reference.md
    agents: [coordinator, evidence, reasoning, critic, remediation]
    document_type: service-reference
  - path: runbooks/cpu_spike_processing_service.md
    agents: [evidence, reasoning, critic, remediation]
    document_type: incident-runbook
  - path: runbooks/memory_leak_worker_service.md
    agents: [evidence, reasoning, critic, remediation]
    document_type: incident-runbook
  - path: runbooks/network_latency_api_gateway_processing_service.md
    agents: [evidence, reasoning, critic, remediation]
    document_type: incident-runbook
  - path: runbooks/high_application_latency_processing_service.md
    agents: [evidence, reasoning, critic, remediation]
    document_type: incident-runbook
  - path: runbooks/data_service_down.md
    agents: [evidence, reasoning, critic, remediation]
    document_type: incident-runbook
