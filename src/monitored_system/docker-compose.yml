name: monitored-system

x-monitored-service: &monitored-service
  build:
    context: .
    dockerfile: infrastructure/Dockerfile
  networks:
    - monitored-system-net
    - observability-net
  restart: unless-stopped
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock

services:
  traffic-generator:
    <<: *monitored-service
    container_name: traffic-generator
    hostname: traffic-generator
    environment:
      HOST_ID: traffic-generator
      MACHINE_ROLE: traffic-generator
      LOG_INTERVAL: ${LOG_INTERVAL:-3}
      WORKLOAD_MODE: application
      APP_COMMAND: "cd /opt/monitored-system/src/traffic-generator && python3 generator.py"
      TARGET_URL: http://api-gateway:5000
      REQUEST_TIMEOUT_SECONDS: ${TRAFFIC_REQUEST_TIMEOUT_SECONDS:-5}
      TRAFFIC_MIN_INTERVAL_SECONDS: ${TRAFFIC_MIN_INTERVAL_SECONDS:-2}
      TRAFFIC_MAX_INTERVAL_SECONDS: ${TRAFFIC_MAX_INTERVAL_SECONDS:-5}
      NETWORK_TARGET_NAME: api-gateway
      NETWORK_PING_TARGET: api-gateway
      NETWORK_TCP_TARGET: api-gateway:5000
    depends_on:
      - api-gateway

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:${TOXIPROXY_VERSION:-2.12.0}
    container_name: monitored-toxiproxy
    hostname: toxiproxy
    command: ["-config", "/config/toxiproxy.json"]
    volumes:
      - ./infrastructure/toxiproxy.json:/config/toxiproxy.json:ro
    networks:
      - monitored-system-net
    restart: unless-stopped

  api-gateway:
    <<: *monitored-service
    container_name: api-gateway
    hostname: api-gateway
    ports:
      - "8080:5000"
    environment:
      HOST_ID: api-gateway
      MACHINE_ROLE: api-gateway
      LOG_INTERVAL: ${LOG_INTERVAL:-3}
      WORKLOAD_MODE: application
      APP_COMMAND: "cd /opt/monitored-system/src/api-gateway && gunicorn --workers 2 --bind 0.0.0.0:5000 app:app"
      # Normal traffic always traverses Toxiproxy, but no toxic is active in the
      # base scenario. This keeps fault injection deterministic on Docker Desktop.
      NOTES_SERVICE_URL: http://toxiproxy:18000
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-3}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-notes-platform-dev-secret}
      NETWORK_TARGET_NAME: processing-service
      NETWORK_PING_TARGET: processing-service
      NETWORK_TCP_TARGET: toxiproxy:18000
    depends_on:
      - processing-service
      - toxiproxy

  processing-service:
    <<: *monitored-service
    container_name: processing-service
    hostname: processing-service
    ports:
      - "8002:8000"
    environment:
      HOST_ID: processing-service
      MACHINE_ROLE: processing-service
      LOG_INTERVAL: ${LOG_INTERVAL:-3}
      WORKLOAD_MODE: application
      APP_COMMAND: "cd /opt/monitored-system/src/processing-service && uvicorn app:app --host 0.0.0.0 --port 8000"
      DATA_SERVICE_URL: http://data-service:8000
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-3}
      FAULT_DELAY_FILE: /var/run/monitored-faults/processing-delay-ms
      MAX_FAULT_DELAY_MS: ${MAX_FAULT_DELAY_MS:-30000}
      NETWORK_TARGET_NAME: data-service
      NETWORK_PING_TARGET: data-service
      NETWORK_TCP_TARGET: data-service:8000
    depends_on:
      - data-service

  data-service:
    <<: *monitored-service
    container_name: data-service
    hostname: data-service
    ports:
      - "8003:8000"
    environment:
      HOST_ID: data-service
      MACHINE_ROLE: data-service
      LOG_INTERVAL: ${LOG_INTERVAL:-3}
      WORKLOAD_MODE: application
      APP_COMMAND: "cd /opt/monitored-system/src/data-service && uvicorn app:app --host 0.0.0.0 --port 8000"
      DATABASE_PATH: /var/lib/notes/notes.db
      NETWORK_TARGET_NAME: processing-service
      NETWORK_PING_TARGET: processing-service
      NETWORK_TCP_TARGET: processing-service:8000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - notes-data:/var/lib/notes

  worker-service:
    <<: *monitored-service
    container_name: worker-service
    hostname: worker-service
    environment:
      HOST_ID: worker-service
      MACHINE_ROLE: background-worker
      WORKLOAD_MODE: synthetic
      LOG_LEVEL_PROFILE: normal
      LATENCY_MIN: 50
      LATENCY_MAX: 1300
      LOG_INTERVAL: ${LOG_INTERVAL:-3}
      NETWORK_TARGET_NAME: api-gateway
      NETWORK_PING_TARGET: api-gateway
      NETWORK_TCP_TARGET: api-gateway:5000

networks:
  monitored-system-net:
    driver: bridge
  observability-net:
    external: true
    name: ${OBSERVABILITY_NETWORK_NAME:-agentic-monitoring-net}

volumes:
  notes-data:
