version: 1
collection: kb-system-engineer-linux
kind: professional-domain-knowledge
primary_role: system_engineer
platform: linux
purpose: runtime-knowledge

documents:
  - path: fundamentals/processes_and_procfs.md
    document_type: technical-reference
    topics: [processes, procfs, pid, file-descriptors]

  - path: fundamentals/cpu_and_load.md
    document_type: technical-reference
    topics: [cpu, load, scheduling, accounting]

  - path: fundamentals/memory_and_pressure.md
    document_type: technical-reference
    topics: [memory, swap, reclaim, pressure, oom]

  - path: fundamentals/filesystems_and_storage.md
    document_type: technical-reference
    topics: [filesystem, mounts, disk, storage, io]

  - path: fundamentals/network_interfaces_and_sockets.md
    document_type: technical-reference
    topics: [network, interfaces, sockets, tcp, udp, routes]

  - path: containers/cgroups_v2.md
    document_type: technical-reference
    topics: [containers, cgroups, cpu, memory, io]

  - path: commands/inspection_commands.md
    document_type: command-reference
    topics: [commands, processes, cpu, memory, disk, network, logs]

content_policy:
  descriptive_only: true
  include_commands: read-only-or-observational
  excluded:
    - incident-specific diagnosis rules
    - thesis scenario ground truth
    - fault-injection instructions
    - remediation recipes tied to evaluation scenarios
