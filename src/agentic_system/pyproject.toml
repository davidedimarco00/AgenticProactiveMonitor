[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-proactive-monitor-agentic-system"
version = "0.1.0"
description = "SPADE-LLM multi-agent backend for Agentic Proactive Monitor"
requires-python = ">=3.11,<3.13"
dependencies = [
    "spade-llm==0.3.0",
    "spade==4.1.4",
    "mcp==1.23.3",
    "py-agentspeak==0.3.0",
    "httpx>=0.27,<1.0",
    "PyYAML>=6.0,<7.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pymongo>=4.11,<5.0",
    "reportlab>=4.2,<5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "pytest-bdd>=8.0,<9.0",
    "websockets>=15.0,<16.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_system*"]

[tool.setuptools.package-data]
agentic_system = ["bdi/plans/*.asl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests requiring the running Dockerized agentic stack",
    "e2e: Gherkin acceptance tests against the running Dockerized agentic stack",
]
