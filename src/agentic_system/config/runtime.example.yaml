opensearch:
  url: http://opensearch:9200
  username: null
  password: null
  verify_ssl: false

detectors:
  enabled: true
  interval_minutes: 1
  metrics:
    - cpu.usage_active
    - mem.used_percent
    - disk.used_percent

topology:
  traffic-generator:
    role: traffic-generator
    dependencies: [api-gateway]
  api-gateway:
    role: api-gateway
    dependencies: [processing-service]
  processing-service:
    role: processing-service
    dependencies: [data-service, worker-service]
  data-service:
    role: data-service
    dependencies: []
  worker-service:
    role: worker-service
    dependencies: []
