name: Agentic Backend Unit Tests

on:
  push:
    branches:
      - feature/agentic-system-backend
      - feature/agentic-system-backend-fault-tolerance
      - feature/agentic-dispatch-bdi
      - agent-react
    paths:
      - "src/agentic_system/**"
      - ".github/workflows/agentic-backend-unit-tests.yml"
  pull_request:
    paths:
      - "src/agentic_system/**"
      - ".github/workflows/agentic-backend-unit-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/agentic_system

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/agentic_system/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run unit tests
        run: python -m pytest tests/unit -v
